<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2185b"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="851" cy="-80" r="20" fill="#e91e63" opacity="0.08"/>
    <circle cx="-81" cy="277" r="20" fill="#e91e63" opacity="0.09"/>
    <circle cx="1215" cy="688" r="27" fill="#e91e63" opacity="0.12"/>
    <circle cx="719" cy="492" r="61" fill="#e91e63" opacity="0.19"/>
    <circle cx="9" cy="36" r="45" fill="#e91e63" opacity="0.12"/>
    <circle cx="1164" cy="154" r="26" fill="#e91e63" opacity="0.06"/>
    <rect x="181" y="372" width="73" height="28" rx="8" fill="#c2185b" opacity="0.13" transform="rotate(36, 171, -42)"/>
    <rect x="588" y="243" width="45" height="64" rx="8" fill="#c2185b" opacity="0.13" transform="rotate(28, 145, 636)"/>
    <rect x="1173" y="361" width="74" height="69" rx="8" fill="#c2185b" opacity="0.13" transform="rotate(42, 841, 40)"/>
    <rect x="536" y="485" width="37" height="35" rx="8" fill="#c2185b" opacity="0.09" transform="rotate(8, 361, 445)"/>
    <rect x="1255" y="656" width="43" height="41" rx="8" fill="#c2185b" opacity="0.03" transform="rotate(40, 154, -77)"/>
    <rect x="682" y="289" width="80" height="97" rx="8" fill="#c2185b" opacity="0.15" transform="rotate(12, -76, 376)"/>
    <rect x="308" y="192" width="85" height="90" rx="8" fill="#c2185b" opacity="0.07" transform="rotate(39, 27, 511)"/>
    <rect x="264" y="354" width="42" height="23" rx="8" fill="#c2185b" opacity="0.06" transform="rotate(33, 336, -96)"/>
    <polygon points="220,391 271,493 169,493" fill="#e91e63" opacity="0.03"/>
    <polygon points="763,249 833,389 693,389" fill="#e91e63" opacity="0.05"/>
    <polygon points="1040,44 1071,106 1009,106" fill="#e91e63" opacity="0.04"/>
    <polygon points="590,399 668,555 512,555" fill="#e91e63" opacity="0.03"/>

  <!-- Wave at bottom -->
  <path d="M0,538 C360,584 840,492 1200,538 L1200,630 L0,630Z" fill="#e91e63" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마르지 않는 1급수 백링크 주스 공급 서비스
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
     — 콘텐츠 급수 정화
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#fff3e0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#fff3e0" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
     마르지 않는 1급수 백링크 주스 공급 서비스 — 콘텐츠 급수 정화
  </text>
</svg>